<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />

    <title>Nutri Planner | Obľúbené jedlá</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="app-bg min-h-screen text-slate-100 has-sticky-footer">
    <header class="site-header">
      <div class="site-header-inner">
        <a href="/dashboard" class="brand">Nutri Planner</a>
        <nav class="site-nav">
