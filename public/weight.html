<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nutri Planner | Váha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="app-bg min-h-screen text-slate-100 has-sticky-footer">
    <header class="site-header">
      <div class="site-header-inner">
        <a href="/dashboard" class="brand">Nutri Planner</a>
        <nav class="site-nav">
          <a href="/dashboard" class="nav-link">Dashboard</a>
          <a href="/app" class="nav-link">Kalkulačka</a>
          <a href="/meals" class="nav-link">Jedlá</a>
          <a href="/weight" class="nav-link">Váha</a>
          <a href="/weekly-report" class="nav-link">Report</a>
          <a href="/favorites" class="nav-link">Obľúbené</a>
          <a href="/achievements" class="nav-link">Odznaky</a>
          <a href="/recommendations" class="nav-link">Tipy</a>
          <a href="/contact" class="nav-link">Kontakt</a>
          <a href="/admin" class="btn-secondary hidden" data-admin-only>Admin panel</a>
          <button id="logout-btn" class="btn-secondary">Odhlásiť sa</button>
        </nav>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">
      <section class="card-dark animate-slide-in">
        <h2 class="text-xl font-semibold mb-4">Zapísať váhu</h2>
        <form id="weight-form" class="flex flex-wrap items-end gap-3" method="post" action="/api/weight">
          <div class="flex-1 min-w-[12rem]">
            <label for="weight-input" class="text-sm text-slate-300">Aktuálna váha (kg)</label>
            <input
              id="weight-input"
              name="weight"
              type="number"
              step="0.1"
              min="20"
              max="400"
              required
              class="form-input mt-1"
              placeholder="napr. 80.5"
            />
          </div>
          <button id="weight-submit" type="submit" class="btn-primary">Zapísať</button>
        </form>
        <p id="weight-message" class="mt-3 text-sm"></p>
      </section>

      <section class="card-dark animate-fade-in">
        <h2 class="text-xl font-semibold mb-4">Vývoj váhy</h2>
        <div id="chart-empty" class="empty-note hidden">
          Zatiaľ nemáš žiadny zápis. Zapíš prvú váhu a graf sa objaví.
        </div>
        <div id="chart-box" class="chart-box">
          <canvas id="weight-chart"></canvas>
        </div>
      </section>

      <section class="card-dark animate-fade-in">
        <h2 class="text-xl font-semibold mb-4">Posledných 10 zápisov</h2>
        <div id="weight-history" class="space-y-2"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 Všetky práva vyhradené — Palatický Enterprise</p>
    </footer>

    <script src="/static/js/vendor/chart.umd.min.js" defer></script>
    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/weight.js" defer></script>
  </body>
</html>
